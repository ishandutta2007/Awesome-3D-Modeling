<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Lighter, vibrant blue-to-cyan) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="60%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>

    <!-- Grid Fade Mask -->
    <radialGradient id="gridMask" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.8" />
      <stop offset="80%" stop-color="white" stop-opacity="0.3" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style><![CDATA[
    /* CSS Styles & Animations */
    @keyframes gridScroll {
      0% {
        stroke-dashoffset: 0;
      }
      100% {
        stroke-dashoffset: -40;
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
      }
      50% {
        filter: drop-shadow(0 4px 10px rgba(127, 0, 255, 0.35));
      }
    }

    @keyframes floatCube {
      0% {
        transform: translateY(0px) rotate(15deg) rotateX(20deg) rotateY(20deg);
      }
      50% {
        transform: translateY(-8px) rotate(195deg) rotateX(45deg) rotateY(-30deg);
      }
      100% {
        transform: translateY(0px) rotate(375deg) rotateX(20deg) rotateY(20deg);
      }
    }

    @keyframes floatOcta {
      0% {
        transform: translateY(0px) rotate(-10deg) rotateX(-15deg) rotateY(45deg);
      }
      50% {
        transform: translateY(10px) rotate(-190deg) rotateX(30deg) rotateY(225deg);
      }
      100% {
        transform: translateY(0px) rotate(-370deg) rotateX(-15deg) rotateY(45deg);
      }
    }

    /* Target Styles */
    .bg-rect {
      fill: url(#bgGrad);
    }

    .moving-grid {
      stroke: #ffffff;
      stroke-width: 0.8;
      stroke-opacity: 0.2;
      stroke-dasharray: 20 20;
      animation: gridScroll 1.5s linear infinite;
    }

    .title-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 46px;
      font-weight: 900;
      fill: #0c183b; /* Highly readable deep indigo */
      letter-spacing: 2px;
      animation: pulseGlow 3s ease-in-out infinite;
    }

    .subtitle-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 16px;
      font-weight: 600;
      fill: #1a2c5b; /* Darker slate for perfect contrast */
      fill-opacity: 0.95;
      letter-spacing: 0.5px;
    }

    /* 3D Shapes Styling */
    .wireframe-cube {
      transform-origin: 710px 90px;
      animation: floatCube 5s linear infinite;
      stroke: #ffffff;
      stroke-width: 1.2;
      fill: #ffffff;
      fill-opacity: 0.1;
      stroke-linejoin: round;
    }

    .wireframe-octa {
      transform-origin: 90px 110px;
      animation: floatOcta 6s linear infinite;
      stroke: #ffffff;
      stroke-width: 1.2;
      fill: #ffffff;
      fill-opacity: 0.1;
      stroke-linejoin: round;
    }

    .axis-line {
      stroke-width: 1.5;
      stroke-linecap: round;
    }

    .axis-text {
      font-family: monospace;
      font-size: 10px;
      font-weight: bold;
    }
  ]]></style>

  <!-- Background Base -->
  <rect class="bg-rect" width="800" height="200" rx="15" />

  <!-- Viewport Grid / Perspective lines -->
  <g opacity="0.6">
    <!-- Perspective Horizon lines -->
    <line x1="0" y1="140" x2="800" y2="140" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.3" />
    <path d="M -100,220 L 400,140 L 900,220 M 100,220 L 400,140 L 700,220 M 300,220 L 400,140 L 500,220 M 400,220 L 400,140" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.25" />
    <!-- Dynamic grid overlay -->
    <line x1="0" y1="160" x2="800" y2="160" class="moving-grid" />
    <line x1="0" y1="180" x2="800" y2="180" class="moving-grid" style="animation-duration: 1s;" />
  </g>

  <!-- Left Side: Octahedron (3D Wireframe) -->
  <g class="wireframe-octa">
    <!-- Octahedron faces / lines (Double pyramid) -->
    <polygon points="90,70 70,110 90,120" />
    <polygon points="90,70 90,120 110,110" />
    <polygon points="90,70 110,110 90,100" />
    <polygon points="90,70 90,100 70,110" />
    <polygon points="90,150 70,110 90,120" />
    <polygon points="90,150 90,120 110,110" />
    <polygon points="90,150 110,110 90,100" />
    <polygon points="90,150 90,100 70,110" />
    <line x1="70" y1="110" x2="110" y2="110" stroke-dasharray="2 2" stroke-opacity="0.5" />
  </g>

  <!-- Left Side Corner: Tiny Viewport Axis Widget -->
  <g transform="translate(40, 40)">
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
    <!-- X Axis (Red) -->
    <line x1="0" y1="0" x2="25" y2="0" class="axis-line" stroke="#ff4d4d" />
    <text x="28" y="4" class="axis-text" fill="#ff4d4d">X</text>
    <!-- Y Axis (Green) -->
    <line x1="0" y1="0" x2="0" y2="-25" class="axis-line" stroke="#2ecc71" />
    <text x="-4" y="-28" class="axis-text" fill="#2ecc71">Y</text>
    <!-- Z Axis (Blue - Isometric) -->
    <line x1="0" y1="0" x2="-15" y2="15" class="axis-line" stroke="#ffffff" />
    <text x="-25" y="23" class="axis-text" fill="#ffffff">Z</text>
  </g>

  <!-- Center Text Information -->
  <g>
    <!-- Main Title with Glow -->
    <text x="50%" y="85" dominant-baseline="middle" text-anchor="middle" class="title-text">
      Awesome 3D Modeling
    </text>
    <!-- Subtitle -->
    <text x="50%" y="130" dominant-baseline="middle" text-anchor="middle" class="subtitle-text">
      The Ultimate Curated List of SaaS &amp; Open Source Tools
    </text>
  </g>

  <!-- Right Side: Rotating Wireframe Cube -->
  <g class="wireframe-cube">
    <!-- Back Face -->
    <rect x="685" y="65" width="50" height="50" stroke-dasharray="3 3" stroke-opacity="0.6"/>
    <!-- Connecting Edges -->
    <line x1="685" y1="65" x2="710" y2="90" />
    <line x1="735" y1="65" x2="760" y2="90" />
    <line x1="685" y1="115" x2="710" y2="140" />
    <line x1="735" y1="115" x2="760" y2="140" />
    <!-- Front Face -->
    <rect x="710" y="90" width="50" height="50" />
  </g>

  <!-- Viewport Corner Bracket accents -->
  <path d="M 20,30 L 20,20 L 30,20" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.8" />
  <path d="M 780,30 L 780,20 L 770,20" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.8" />
  <path d="M 20,170 L 20,180 L 30,180" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.8" />
  <path d="M 780,170 L 780,180 L 770,180" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.8" />
</svg>

